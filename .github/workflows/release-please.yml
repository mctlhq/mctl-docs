name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The org disables "Allow GitHub Actions to create and approve pull
      # requests", so the default GITHUB_TOKEN can update an existing
      # release-please PR but cannot create the next one. That exact failure
      # left mctl-telegram merged-but-unreleased until mctl-telegram#498.
      # Mint from the internal mctl-agents App instead; the token is narrowed
      # to this repository and only the permissions release-please needs.
      # This bot mint still uses AGENTS_APP_PRIVATE_KEY until Stage 5 of
      # mctl-gitops#1033 moves it to mctl-repo-bot.
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-docs
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Dispatch lives in its own job so it can carry a main-only environment and
  # so the dispatch key is never in the same job as release-please. The
  # environment `app-dispatch` is restricted to the default branch: on any
  # other ref it yields no secret and the mint step fails closed. There is
  # deliberately no fallback to AGENTS_APP_PRIVATE_KEY (mctl-gitops#1033).
  dispatch:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: app-dispatch
    permissions: {}
    steps:
      # mctl-gitops-dispatch is the dispatch-only App: actions:write on
      # mctl-gitops, nothing else. Deliberately NOT MCTL App (APP_CLIENT_ID,
      # installed by customers) and no longer the broad mctl-agents App.
      - name: Generate dispatch token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-actions: write

      - name: Dispatch centralized release-deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-docs \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-docs \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-docs
