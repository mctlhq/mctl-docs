name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The org disables "Allow GitHub Actions to create and approve pull
      # requests", so the default GITHUB_TOKEN can update an existing
      # release-please PR but cannot create the next one. That exact failure
      # left mctl-telegram merged-but-unreleased until mctl-telegram#498.
      # Mint from the internal mctl-agents App instead; the token is narrowed
      # to this repository and only the permissions release-please needs.
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-docs
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Uses mctl-agents, the backend-only automation App — deliberately
      # NOT MCTL App (secrets.APP_ID). MCTL App is the App customers install
      # themselves from mctl.ai/#request-access, and it is being narrowed to
      # contents:read + metadata:read so its published least-privilege
      # description is actually true (mctlhq/mctl-gitops#761). A GitHub App's
      # permissions apply to every installation alike, so anything needing
      # write — like actions:write on mctl-gitops to dispatch below — has to
      # live on the internal App instead.
      - name: Generate Platform App token
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops

      - name: Dispatch centralized release-deploy
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-docs \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-docs \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-docs
