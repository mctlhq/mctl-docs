name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@aca5e626d3066bde2b408697b8667ed6bf4eb51d
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # dependabot and mctl-agents are listed so their PRs get reviewed
      # automatically. Without the slug claude-code-action hard-fails with
      # "Workflow initiated by non-human actor", and since branch protection
      # requires an approving review, those PRs then sit unmergeable until a
      # maintainer triggers a review by hand. mctl-agents is the App that
      # runs release-please here, so every release PR needs it.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot,mctl-agents"
      conventions: |
        Flag broken links or references introduced by documentation changes.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
