server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Cloudflare and Traefik the container port (8080) and scheme are
    # internal: an absolute redirect for a slashless directory such as /api
    # pointed browsers at http://docs.mctl.ai:8080/api/, which HSTS then
    # upgrades to https on :8080 and TLS fails. Relative Location keeps the
    # public host, port and scheme.
    absolute_redirect off;

    # Unknown paths must answer 404, not the home page with status 200
    # (soft 404: search engines index junk URLs as duplicates of /).
    # VitePress emits 404.html.
    error_page 404 /404.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # script-src hashes replace 'unsafe-inline'. __SCRIPT_SRC_HASHES__ is
    # substituted at image build from VitePress HTML (scripts/csp-hashes.ts).
    # style-src keeps 'unsafe-inline': Vue/VitePress emit inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.mctl.ai __SCRIPT_SRC_HASHES__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ui.mctl.ai; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui.mctl.ai https://avatars.githubusercontent.com; connect-src 'self' https://mctl.ai https://stats.mctl.ai;" always;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health checks
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location = /readyz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # VitePress assets — immutable, 1 year cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images — moderate cache
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    # VitePress clean URLs: /page -> page.html, /dir -> dir/index.html.
    # No catch-all fallback: anything else is a real 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # A page URL written with a trailing slash (/guides/domains/) used to 404,
    # because only directories may end in a slash. Serve the slashless
    # page when that page exists. Directories keep working (index.html first).
    location ~ ^/(?<page>.+)/$ {
        try_files $uri/index.html /$page.html =404;
    }
}
